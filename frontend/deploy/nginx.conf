upstream nrims_api { server backend:8000; keepalive 16; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /nginx-health { 
    access_log off; 
    return 200 "ok\n"; 
  }

  # Cloud Shell Proxy Bypass Route
  location /nrims-api/ {
    proxy_pass http://nrims_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NRIMS-Auth $http_x_nrims_auth;
    
    # Backend ke duplicate headers ko hide karein
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    
    add_header Access-Control-Allow-Origin '*' always;
    add_header Access-Control-Expose-Headers 'X-Total-Count' always;
    include /etc/nginx/security-headers.inc;
  }

  # Legacy Route
  location /api/ {
    proxy_pass http://nrims_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NRIMS-Auth $http_x_nrims_auth;
    
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    
    add_header Access-Control-Allow-Origin '*' always;
    add_header Access-Control-Expose-Headers 'X-Total-Count' always;
    include /etc/nginx/security-headers.inc;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.inc;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    include /etc/nginx/security-headers.inc;
  }
}
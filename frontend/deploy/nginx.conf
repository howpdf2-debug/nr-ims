upstream nrims_api { server backend:8000; keepalive 16; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/security-headers.inc;  # NOTE: add_header in a location drops inherited ones

  location = /nginx-health { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://nrims_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location = /healthz { proxy_pass http://nrims_api; }
  location = /readyz  { proxy_pass http://nrims_api; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/security-headers.inc; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-store"; include /etc/nginx/security-headers.inc; }
}

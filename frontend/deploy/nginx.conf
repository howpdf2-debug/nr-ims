upstream nrims_api { server backend:8000; keepalive 16; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  include /etc/nginx/security-headers.inc;  # NOTE: add_header in a location drops inherited ones -> re-included below

  location = /nginx-health { access_log off; return 200 "ok\n"; }

  # ── API: two public paths, ONE backend (the backend routes stay /api/v1/...) ─────────────────────────────
  #   /nrims-api/  -> backend /api/   what the web UI calls. Hosting proxies such as Google Cloud Shell Web Preview
  #                                   intercept the generic "/api/" path (302 to a Google sign-in page).
  #   /api/        -> backend /api/   unchanged: curl, scripts/smoke_phase2.sh, docs, Swagger.
  location /nrims-api/ {
    proxy_pass http://nrims_api/api/;   # the URI part replaces the matched prefix: /nrims-api/v1/x -> /api/v1/x
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_hide_header X-Content-Type-Options;  # nginx sets these once (security-headers.inc); the backend's copies
    proxy_hide_header X-Frame-Options;          # would otherwise duplicate them, with a conflicting Referrer-Policy
    proxy_hide_header Referrer-Policy;
    # X-NRIMS-Auth (the UI's token header) is passed through untouched: nginx forwards all request headers by default.
  }
  location /api/ {
    proxy_pass http://nrims_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_hide_header X-Content-Type-Options;  # nginx sets these once (security-headers.inc); the backend's copies
    proxy_hide_header X-Frame-Options;          # would otherwise duplicate them, with a conflicting Referrer-Policy
    proxy_hide_header Referrer-Policy;
  }
  location = /healthz { proxy_pass http://nrims_api; proxy_hide_header X-Content-Type-Options; proxy_hide_header X-Frame-Options; proxy_hide_header Referrer-Policy; }
  location = /readyz  { proxy_pass http://nrims_api; proxy_hide_header X-Content-Type-Options; proxy_hide_header X-Frame-Options; proxy_hide_header Referrer-Policy; }

  # ── Static files ──────────────────────────────────────────────────────────────────────────────────────────
  # Hashed build output: cache forever. A name that does not exist is a real 404 (never the SPA page served as
  # "JavaScript"): that is what makes a stale browser tab fail loudly, and lib/chunkReload.ts then reloads it.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";   # 2xx/3xx only (no "always"): a 404 is not cached
    include /etc/nginx/security-headers.inc;
  }

  # The app shell names the hashed chunk files of THIS build, so it must never be cached anywhere.
  location = /index.html {
    etag off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    include /etc/nginx/security-headers.inc;
  }
  # SPA routes (/alarms, /device/<id>, ...) fall back to the shell and get the same no-store treatment.
  location / {
    try_files $uri /index.html;
    etag off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    include /etc/nginx/security-headers.inc;
  }
}

name: nr-ims

x-backend-env: &backend-env
  NRIMS_ENV: ${NRIMS_ENV:-development}
  NRIMS_DATA_PROVIDER: ${NRIMS_DATA_PROVIDER:-simulator}
  NRIMS_LOG_LEVEL: ${NRIMS_LOG_LEVEL:-INFO}
  NRIMS_IN_CONTAINER: "true"
  # Service name `db` (NOT localhost). Prefix NRIMS_ is mandatory - see app/config.py.
  # Use a hex password (openssl rand -hex 24): '@ : / # %' would break this URL.
  NRIMS_DATABASE_URL: postgresql+asyncpg://nrims:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/nrims
  NRIMS_VALKEY_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}@valkey:6379/0
  NRIMS_SECRET_KEY: ${NRIMS_SECRET_KEY:?set NRIMS_SECRET_KEY in deploy/.env}
  NRIMS_CORS_ORIGINS: ${NRIMS_CORS_ORIGINS:-["http://localhost:8080"]}
  NRIMS_DOCS_ENABLED: ${NRIMS_DOCS_ENABLED:-true}
  NRIMS_SEED_ADMIN_PASSWORD: ${NRIMS_SEED_ADMIN_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nrims
      POSTGRES_USER: nrims
      # NOTE: only applied when the volume is first created. Changing it later
      # needs `docker compose down -v` (dev) or ALTER USER (prod).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrims -d nrims"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--requirepass", "${VALKEY_PASSWORD}"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # One-shot job: runs migrations exactly once per `up`, before the API starts.
  migrate:
    build: { context: ../backend }
    image: nr-ims-backend:local
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [backend]

  backend:
    image: nr-ims-backend:local
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend, frontend]

  frontend:
    build: { context: ../frontend }
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [frontend]

networks:
  backend: {}
  frontend: {}

volumes:
  pgdata:

[project]
name = "nr-ims-backend"
version = "0.1.0"
description = "Northern Railway Integrated Network Management System - backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",  # <-- यह जोड़ना बहुत ज़रूरी था
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "valkey>=6.0",
  "structlog>=24.1",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4.1",
  "faker>=25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["S101", "B008"]   # B008: FastAPI Depends() in defaults is the idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/models/*" = ["F821"]   # string forward refs in Mapped["Model"] relationships
"seed_*.py" = ["E501", "S311"]
"simulate_fault.py" = ["E501"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
# Baseline: strict typing of every function is a separate hardening project (76 findings).
# This still type-checks function bodies and catches real mismatches.
strict = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true